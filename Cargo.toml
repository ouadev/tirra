[package]
name = "tirra"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[dependencies]
# ICED
iced = { version = "0.14.0", features = [ "tokio"] }

# Sqlite Database
rusqlite = { version = "0.32.0", features = ["bundled"] }

# tirravfs sqlite3 extension - static linking
tirra-vfs = { path = "../tirra-vfs", features = ["static"] }

# Date and Time
chrono = "0.4.38"

# Encrpyption
#chacha20poly1305 = "0.10.1"
chacha20 = {version  = "0.10.0", features = [ "rng"]}
poly1305 = "0.8.0"
sha2 = "0.10.8"
base64 = "0.22.1"
pbkdf2 = "0.12.2"

# CLI Password 
rpassword = "7.4"

[profile.release]
strip = true    # Automatically strip symbols from the binary.
panic = "abort"
opt-level = "z"
lto = true
