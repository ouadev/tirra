[package]
name = "tirra"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = {version = "0.12.1", features = ["highlighter", "tokio", "debug"]}

rusqlite = { version = "0.32.0", features = ["bundled"] }

# Encrpyption
chacha20poly1305 = "0.10.1"
rand = "0.8.5"

# Serialization of data ( mainly enc keys)
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"

# Error management
anyhow = "1.0.86"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
panic = "abort"
opt-level = "z"
lto = true